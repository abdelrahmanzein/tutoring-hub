<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quiz · Mr Zein's Tutoring Groups</title>
  <style>
    :root { --bg:#f3f5f9; --card:#fff; --text:#18202e; --sub:#5b6577; --line:#d9dee8; --accent:#2457c5; --accent-soft:#e8eefb; --ok:#15803d; --ok-bg:#f0fdf4; --bad:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#10141c; --card:#1a2030; --text:#e8ecf3; --sub:#9aa5b8; --line:#2c3446; --accent:#7aa2ff; --accent-soft:#1f2b44; --ok:#4ade80; --ok-bg:#12261a; --bad:#ff8a80; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width:560px; margin:0 auto; padding:20px 16px 40px; } .brand { color:var(--accent); font-weight:700; } h1 { font-size:22px; margin:6px 0 2px; }
    h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--sub); margin:22px 0 8px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; } .sub { color:var(--sub); font-size:14px; }
    .names { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .names button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:12px; padding:12px; text-align:start; cursor:pointer; }
    .names button.on { border-color:var(--accent); background:var(--accent-soft); font-weight:600; }
    .file { display:block; border:2px dashed var(--line); border-radius:12px; padding:18px; text-align:center; color:var(--sub); cursor:pointer; }
    .file b { color:var(--text); } .file input { display:none; }
    .btn { display:block; width:100%; font:inherit; font-weight:600; border:0; border-radius:12px; padding:13px; background:var(--accent); color:#fff; margin-top:12px; cursor:pointer; }
    .btn:disabled { opacity:.5; } .btn.sec { background:var(--card); color:var(--accent); border:1px solid var(--accent); }
    .done { background:var(--ok-bg); border-color:var(--ok); text-align:center; } .done b { color:var(--ok); font-size:20px; }
    .err { color:var(--bad); margin-top:8px; }
  </style>
</head>
<body>
<main id="main"><p class="sub">Loading…</p></main>
<script>// Front page on GitHub Pages: talks to the Apps Script web app with fetch, but keeps the same
// google.script.run calls the screens already use, so the screens are shared with the Apps Script version.
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyCLTCfTmk_UHXW6_aSQ28cSyYRWWiUpFdx4Tsa5epjAviwggqbnqIvu89apC2YxQdz/exec';
var google = { script: { get run() {
  var ok = function () {}, fail = function () {};
  var o = {
    withSuccessHandler: function (f) { ok = f; return o; },
    withFailureHandler: function (f) { fail = f; return o; },
    api: function (token, action, args) {
      // Google sometimes answers with an error page (cold start); one quiet retry fixes almost all of them.
      // Only reads and self-protecting saves are retried (payments re-check the balance, sessions refuse duplicates,
      // imports and deletes are safe to repeat). Other saves are never repeated automatically.
      var retry = ['quizSubmit', 'tutorReport', 'joinSubmit', 'addAdjustment', 'addAccount', 'undoSession', 'undoStudentEdit', 'updateStudent', 'confirmAccount'].indexOf(action) < 0;
      var attempt = function (n) {
        fetch(EXEC_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify({ token: token, action: action, args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            // Hand the answer over outside this promise, so a drawing problem on the page is never reported as "no connection".
            setTimeout(function () { if (j.ok) ok(j.res); else fail(new Error(j.error)); }, 0);
          })
          .catch(function (e) {
            // Google sometimes answers with an error page instead of data ("The string did not match the expected pattern").
            if (n < 3 && retry) return setTimeout(function () { attempt(n + 1); }, 1500 * n);
            fail(new Error(retry ? 'Google didn\'t answer just now. Tap Refresh in a moment.'
              : 'Not sure this was saved (connection problem). Tap Refresh and check before trying again.'));
          });
      };
      attempt(1);
    }
  };
  return o;
} } };

// Keeps the last loaded data on this device, so the app opens with it instantly and refreshes in the background.
function saveCache() {
  setTimeout(function () {
    try { localStorage.setItem('th_cache', JSON.stringify(CACHE)); }
    catch (e) {                                    // too big for the phone's storage: keep everything but the student pages
      try { var c = {}; Object.keys(CACHE).forEach(function (k) { if (k.indexOf('profile|') !== 0) c[k] = CACHE[k]; }); localStorage.setItem('th_cache', JSON.stringify(c)); } catch (e2) {}
    }
  }, 0);
}
function loadCache() {
  try {
    var c = JSON.parse(localStorage.getItem('th_cache') || 'null');
    // Saved data shows at once but counts as old: it's replaced as soon as the fresh download arrives.
    if (c) { Object.keys(c).forEach(function (k) { c[k].snap = false; c[k].at = 0; }); CACHE = c; }
  } catch (e) { /* ignore */ }
}

// The secret token comes once in the link (#t=...), is kept on this device, and removed from the address bar.
function boot() {
  var m = location.hash.match(/t=([0-9a-f]+)/);
  // The token stays in the link on purpose: an iPhone Home Screen app keeps its own storage, separate from Safari,
  // so the icon must be added from the full link to carry the token in.
  if (m) { try { localStorage.setItem('th_token', m[1]); } catch (e) {} }
  var token = ''; try { token = localStorage.getItem('th_token') || ''; } catch (e) {}
  if (!token) {
    document.getElementById('splash').innerHTML = '<div class="splash-name">Tutoring Hub</div><div class="sub" style="max-width:300px;text-align:center;line-height:1.5">' +
      'This copy of the app has no sign-in yet.<br>Open your private setup link in Safari, then Share → Add to Home Screen from that page.</div>';
    return;
  }
  loadCache();
  start(token);
}
</script>
<script>
var KEY = (new URLSearchParams(location.search).get('g') || '').replace(/[^0-9a-f]/g, '');
function api(action, args, ok, fail) {
  google.script.run.withSuccessHandler(function (r) { ok(r.data); }).withFailureHandler(function (e) { fail(e.message || String(e)); }).api('', action, args);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var P = null, WHO = '', FILE = null;
var head = function (title, sub) { return '<div class="brand">Mr Zein\'s Tutoring Groups</div><h1>' + esc(title) + '</h1>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : ''); };

// The group's quiz page: the names, the PDF and Submit while a quiz is open; otherwise "no quiz is open".
function draw() {
  var m = document.getElementById('main');
  if (!P.valid) { m.innerHTML = head('Quiz') + '<div class="card">This link is not valid.</div>'; return; }
  if (!P.quiz) { m.innerHTML = head(P.group) + '<div class="card" style="text-align:center"><div style="font-size:34px">🕓</div><b>No quiz is open right now</b><div class="sub">This page opens for submissions when your next quiz starts.</div></div>'; return; }
  m.innerHTML = head('Quiz: ' + P.quiz.topic, P.group + ' · open now') +
    '<h2>1. Your name</h2><div class="names">' + P.names.map(function (n) {
      return '<button class="' + (WHO === n.id ? 'on' : '') + '" onclick="WHO=\'' + esc(n.id) + '\';draw()">' + esc(n.name) + '</button>'; }).join('') + '</div>' +
    '<h2>2. Your quiz (one PDF)</h2><div class="card"><label class="file"><input type="file" accept="application/pdf,.pdf" onchange="pick(this)">' +
      (FILE ? '📄 <b>' + esc(FILE.name) + '</b><div class="sub">' + (Math.round(FILE.size / 1024 / 102.4) / 10) + ' MB · tap to choose another</div>' : '📄 <b>Choose your PDF</b><div class="sub">Tap here</div>') + '</label>' +
    '<button class="btn" id="go" onclick="send()"' + (WHO && FILE ? '' : ' disabled') + '>Submit</button><div class="err" id="err"></div>' +
    '<div class="sub" style="margin-top:8px">Only Mr Zein can see what you submit. You can submit again while the quiz is open; the latest PDF counts.</div></div>';
}
function pick(el) {
  var f = el.files && el.files[0];
  if (!f) return;
  if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { FILE = null; draw(); document.getElementById('err').textContent = 'Please choose a PDF file.'; return; }
  if (f.size > 100 * 1024 * 1024) { FILE = null; draw(); document.getElementById('err').textContent = 'This PDF is larger than 100 MB. Please make it smaller and try again.'; return; }
  FILE = f; draw();
}
// Reads the PDF and sends it (one try: a failed upload is never repeated by itself). Over 20 MB it goes straight to
// Google Drive through a one-time upload address, with progress.
function send() {
  var b = document.getElementById('go'), err = document.getElementById('err');
  b.disabled = true; b.textContent = 'Sending… keep this page open'; err.textContent = '';
  if (FILE.size > 20 * 1024 * 1024) return sendBig(b, err);
  var r = new FileReader();
  r.onload = function () {
    api('quizSubmit', { key: KEY, quizId: P.quiz.id, studentId: WHO, data: String(r.result).split(',')[1] }, received, function (e) { b.disabled = false; b.textContent = 'Submit'; err.textContent = /did not match|didn.t answer|Not sure/.test(e) ? 'It may not have arrived (connection problem). Please submit again.' : e; });
  };
  r.onerror = function () { b.disabled = false; b.textContent = 'Submit'; err.textContent = 'Could not read this file. Please choose it again.'; };
  r.readAsDataURL(FILE);
}
function received(res) {
  var at = String(res.at || '').slice(11);
  document.getElementById('main').innerHTML = head('Quiz: ' + P.quiz.topic, P.group) +
    '<div class="card done"><div style="font-size:40px">✅</div><b>Received, ' + esc(res.name) + '</b><div>' + (at ? 'at ' + esc(at) : '') + '</div>' +
    '<div class="sub" style="margin-top:6px">Sent the wrong file? Go back, choose your name and submit again while the quiz is open.</div></div>' +
    '<button class="btn sec" onclick="FILE=null;WHO=\'\';draw()">Back</button>';
}
function sendBig(b, err) {
  var again = function (msg) { b.disabled = false; b.textContent = 'Submit'; err.textContent = msg || 'It didn\'t arrive (connection problem). Please submit again.'; };
  var args = { key: KEY, quizId: P.quiz.id, studentId: WHO };
  api('quizUploadStart', Object.assign({ size: FILE.size }, args), function (r) {
    var x = new XMLHttpRequest();
    x.open('PUT', r.url);
    x.upload.onprogress = function (e) { if (e.lengthComputable) b.textContent = 'Sending… ' + Math.floor(e.loaded / e.total * 100) + '% · keep this page open'; };
    x.onload = function () {
      if (x.status >= 300) return again();
      var id = ''; try { id = JSON.parse(x.responseText).id || ''; } catch (e) { id = ''; }
      b.textContent = 'Almost done…';
      api('quizUploadDone', Object.assign({ fileId: id }, args), received, again);
    };
    x.onerror = function () { again(); };
    x.send(FILE);
  }, again);
}
if (!KEY) { P = { valid: false }; draw(); }
else api('quizPage', { key: KEY }, function (p) { P = p; draw(); }, function () { document.getElementById('main').innerHTML = head('Quiz') + '<div class="card">Couldn\'t load just now. Please refresh the page.</div>'; });
</script>
</body>
</html>
