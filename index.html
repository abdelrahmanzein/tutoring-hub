<!DOCTYPE html>
<html>
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tutoring Hub</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tutoring Hub">
  <meta name="theme-color" content="#2457c5">
  <style>
  :root {
    --bg:#f3f5f9; --card:#ffffff; --text:#18212e; --muted:#667385; --line:#e2e7ef;
    --accent:#2457c5; --accent-soft:#e8eefb; --accent-text:#ffffff;
    --warn:#b45309; --bad:#c2352b; --bad-soft:#fdecea; --good:#1f7a4d; --good-soft:#e6f4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#10141b; --card:#1a2029; --text:#e8ecf2; --muted:#98a3b3; --line:#2a3340;
      --accent:#7aa5ff; --accent-soft:#1f2b44; --accent-text:#0d1218;
      --warn:#f0b050; --bad:#ff8a80; --bad-soft:#3a1f1e; --good:#6fd39f; --good-soft:#163024;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, system-ui, sans-serif; padding-bottom:76px; }

  /* Header with a thin loading bar that runs while the app talks to the server */
  header { position:sticky; top:0; background:var(--card); padding:12px 16px 10px; border-bottom:1px solid var(--line); z-index:5; }
  header::after { content:''; position:absolute; left:0; bottom:-1px; height:3px; width:0; background:var(--accent); transition:width .2s; }
  body.loading header::after { width:100%; animation:load 1.2s ease-in-out infinite; }
  @keyframes load { 0% { left:0; width:0 } 50% { left:20%; width:60% } 100% { left:100%; width:0 } }
  header .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  h1 { font-size:19px; margin:0; color:var(--accent); }
  .updated { color:var(--muted); font-size:13px; }

  /* Buttons: filled = main action, outlined = secondary. All show a hand cursor and react when pressed. */
  button { font:inherit; border:1px solid var(--accent); background:var(--card); color:var(--accent); border-radius:10px; padding:8px 14px; cursor:pointer; transition:background .15s, transform .05s; }
  button:hover { background:var(--accent-soft); }
  button:active { transform:scale(.97); }
  button.primary { background:var(--accent); color:var(--accent-text); }
  button.primary:hover { filter:brightness(1.08); }
  button.small { padding:4px 10px; font-size:13px; border-color:var(--line); color:var(--muted); }
  button.small:hover { color:var(--bad); border-color:var(--bad); background:var(--bad-soft); }
  button:disabled { opacity:.55; cursor:wait; }

  main { padding:12px 16px; max-width:720px; margin:0 auto; }

  /* Bottom tab bar */
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; border-radius:0; background:none; padding:8px 2px 10px; font-size:12px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button .ico { font-size:20px; filter:grayscale(1); opacity:.6; }
  nav button.on { color:var(--accent); font-weight:600; }
  nav button.on .ico { filter:none; opacity:1; }
  nav button:hover { background:var(--accent-soft); }

  input, select { font:inherit; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
  select { cursor:pointer; }
  .filters { display:flex; gap:8px; margin:8px 0 12px; }

  /* Cards. A card you can tap has a hand cursor, lifts on hover and shows › on the right. */
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .card[onclick] { cursor:pointer; transition:border-color .15s, box-shadow .15s, transform .05s; }
  .card[onclick]:hover { border-color:var(--accent); box-shadow:0 2px 10px rgba(36,87,197,.12); }
  .card[onclick]:active { transform:scale(.99); }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .item .right { margin-left:auto; display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; }
  .item > div:first-child { flex:1; min-width:0; }
  @media (max-width: 480px) {
    .card.item { flex-wrap:wrap; }
    .item .right { order:3; width:100%; justify-content:flex-start; margin-left:0; }
    .card.item .chev { position:absolute; right:12px; top:14px; }
    .card[onclick] { position:relative; padding-right:30px; }
  }
  .chev { color:var(--accent); font-size:22px; line-height:1; margin-left:4px; }
  .sub { color:var(--muted); font-size:13px; }

  /* Small status labels */
  .tag { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:2px 9px; color:var(--muted); white-space:nowrap; }
  .tag.warn { color:var(--warn); border-color:var(--warn); }
  .tag.owe { color:var(--bad); background:var(--bad-soft); border-color:transparent; font-weight:600; }
  .tag.good { color:var(--good); background:var(--good-soft); border-color:transparent; }
  .neg { color:var(--bad); font-weight:600; }
  .pos { color:var(--good); font-weight:600; }

  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; }
  dt { color:var(--muted); font-size:14px; }
  dd { margin:0; word-break:break-word; }
  h2 { font-size:14px; margin:18px 0 6px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .error { color:var(--bad); padding:12px 0; }
  .soon { color:var(--muted); text-align:center; padding:40px 0; }
  a { color:var(--accent); }

  /* Top of a page: a plain "‹ Back" link, then the page's actions side by side, equal width */
  .back { border:0; background:none; padding:4px 0; color:var(--accent); font-weight:600; }
  .back:hover { background:none; text-decoration:underline; }
  .actions { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin:8px 0 4px; }
  .actions button { width:100%; padding:11px 8px; }

  /* A tappable number inside a card (e.g. "4 unpaid sessions ›") */
  .link-row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--bad-soft); color:var(--bad); cursor:pointer; font-weight:600; }
  .link-row:hover { filter:brightness(.97); }
  #saving { position:fixed; left:50%; transform:translate(-50%, 20px); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:30; background:var(--text); color:var(--bg);
    padding:7px 14px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; }
  #saving.on { opacity:.92; transform:translate(-50%, 0); } #saving.ok { background:var(--good); color:#fff; }
  .nav-row { display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; }

  /* Bottom sheet overlay for details */
  .sheet-bg { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:30; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--card); width:100%; max-width:720px; max-height:80vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px; box-shadow:0 -6px 24px rgba(0,0,0,.2); }
  .sheet .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .sheet .row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); }
  .sheet .row:last-child { border-bottom:0; }

  /* Currency marks: EGP payers orange, USD payers green (pill + coloured left edge on cards) */
  .cur { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.03em; border-radius:6px; padding:1px 6px; vertical-align:1px; }
  .cur.EGP { background:#ffedd5; color:#c2410c; }
  .cur.USD { background:#dcfce7; color:#15803d; }
  .card.cur-EGP { border-left:4px solid #f97316; }
  .card.cur-USD { border-left:4px solid #22c55e; }
  @media (prefers-color-scheme: dark) {
    .cur.EGP { background:#43260f; color:#fdba74; }
    .cur.USD { background:#123222; color:#86efac; }
  }

  .totals { display:grid; grid-template-columns:auto 1fr 1fr; gap:6px 12px; align-items:center; }
  .totals > div:nth-child(3n+2), .totals > div:nth-child(3n) { text-align:right; }

  /* Opening screen: logo while the first data loads */
  #splash { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .35s; }
  #splash.gone { opacity:0; pointer-events:none; }
  .splash-name { font-size:22px; font-weight:700; color:var(--accent); letter-spacing:.01em; }
  .splash-dots span { display:inline-block; width:8px; height:8px; margin:0 3px; border-radius:50%; background:var(--accent); animation:dot 1s infinite ease-in-out; }
  .splash-dots span:nth-child(2) { animation-delay:.15s } .splash-dots span:nth-child(3) { animation-delay:.3s }
  @keyframes dot { 0%,80%,100% { transform:scale(.5); opacity:.4 } 40% { transform:scale(1); opacity:1 } }

  /* Money: Students | Income switch */
  .seg { display:flex; background:var(--line); border-radius:10px; padding:3px; margin-bottom:10px; }
  .seg button { flex:1; border:0; background:none; color:var(--muted); padding:8px; border-radius:8px; }
  .seg button.on { background:var(--card); color:var(--accent); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }

  /* Income: number tiles, bar charts, tables */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:8px; margin-bottom:8px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .tile .big { font-size:22px; font-weight:700; margin:2px 0; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:150px; margin-top:8px; }
  .bar-col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; cursor:pointer; }
  .bar { width:70%; max-width:26px; border-radius:4px 4px 0 0; }
  .bar.EGP { background:#f97316; } .bar.USD { background:#22c55e; } .bar.TOTAL { background:var(--accent); }
  .cur.TOTAL { background:var(--accent-soft); color:var(--accent); }
  .tbl-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; padding:8px 10px; }
  .tbl-wrap .tbl td, .tbl-wrap .tbl th { white-space:nowrap; }
  .bar-col:hover .bar { filter:brightness(1.1); }
  .bar-val { font-size:9px; color:var(--muted); min-height:13px; white-space:nowrap; letter-spacing:-.02em; }
  .bar-lbl { font-size:11px; color:var(--muted); margin-top:3px; border-top:1px solid var(--line); width:100%; text-align:center; padding-top:2px; }
  .tbl { width:100%; border-collapse:collapse; font-size:14px; }
  .tbl th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:4px 6px; border-bottom:1px solid var(--line); }
  .tbl td { padding:6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl tr:last-child td { border-bottom:0; }

  /* Roster chips, recent students, profile header, collapsible sections */
  .chips, .recent { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; align-items:center; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:5px 12px; font-size:14px; }
  .chip.on { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .profile-head { margin:8px 0 4px; }
  .pname { font-size:21px; font-weight:700; }
  .parabic { font-size:17px; color:var(--muted); margin:2px 0 4px; }
  details.card summary { cursor:pointer; color:var(--accent); font-weight:600; }

  /* A secondary action that still reads clearly as a button */
  button.secondary { width:100%; padding:11px; border:1px solid var(--accent); color:var(--accent); background:var(--card); font-weight:600; }

  /* Today: session title and homework-coloured student chips */
  .sess-title { font-size:17px; font-weight:700; }
  .chip.hw-ok { border-color:var(--good); } .chip.hw-late { border-color:#d97706; } .chip.hw-miss { border-color:var(--bad); background:var(--bad-soft); }
  .chip.hw-wait { border-style:dashed; }
  .note { background:#fff7e6; border:1px solid #f5c26b; border-radius:10px; padding:8px 10px; margin:6px 0; font-size:14px; }
  @media (prefers-color-scheme: dark) { .note { background:#3a2c12; border-color:#8a6420; } }

  /* Grey placeholders shown for the split second before a screen's data arrives */
  .skeleton { height:58px; border-radius:12px; margin-bottom:10px; background:linear-gradient(90deg, var(--line) 25%, var(--card) 50%, var(--line) 75%); background-size:200% 100%; animation:shimmer 1.2s infinite; }
  @keyframes shimmer { from { background-position:200% 0 } to { background-position:-200% 0 } }
</style>

</head>
<body>
  <div id="splash">
    <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
      <rect x="2" y="2" width="80" height="80" rx="22" fill="#2457c5"/>
      <path d="M42 20 L66 31 L42 42 L18 31 Z" fill="#fff"/>
      <path d="M28 37 v11 c0 5 7 9 14 9 s14-4 14-9 v-11 l-14 6.5 Z" fill="#fff" opacity=".9"/>
      <path d="M62 33 v14" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
      <circle cx="62" cy="49" r="3" fill="#f97316"/>
    </svg>
    <div class="splash-name">Tutoring Hub</div>
    <div class="splash-dots"><span></span><span></span><span></span></div>
  </div>
  <header>
    <div class="row">
      <h1 id="title">Sessions</h1>
      <div><span class="updated" id="updated"></span> <button id="refresh">Refresh</button></div>
    </div>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
  <script>
// Page logic. Every screen loads live data when it opens and shows when it was fetched.
var TOKEN = '', TABS = ['Sessions', 'To do', 'Students', 'Groups', 'Income', 'Settings'];
var ICONS = { 'Sessions': '📅', 'To do': '✅', 'Students': '👥', 'Groups': '🧑‍🏫', 'Income': '📈', 'Settings': '⚙️' };
var current = 'Sessions', fetchedAt = null, listCache = null, refreshView = null;

// Starts the app: builds the tab bar and opens Sessions.
function start(token) {
  TOKEN = token;
  var nav = document.getElementById('nav');
  TABS.forEach(function (t) {
    var b = document.createElement('button');
    b.innerHTML = '<span class="ico">' + ICONS[t] + '</span>' + t; b.id = 'tab-' + t;
    b.onclick = function () { openTab(t); };
    nav.appendChild(b);
  });
  // Refresh asks the server for fresh data (skipping its 2-minute cache) for the screen and the background preload.
  document.getElementById('refresh').onclick = function () {
    if (READ_URL) return refreshFromServer();
    FRESH_UNTIL = Date.now() + 4000; if (refreshView) refreshView(); prefetch(true);
  };
  setInterval(showAge, 30000);
  setTimeout(hideSplash, 8000);
  if (READ_URL) loadSnapshots();
  openTab('Sessions');
  if (!READ_URL) prefetch();
}

// Switches tab.
function openTab(tab) {
  current = tab; newView();
  TABS.forEach(function (t) { document.getElementById('tab-' + t).className = t === tab ? 'on' : ''; });
  document.getElementById('title').textContent = tab;
  if (tab === 'Students') return showStudents();
  if (tab === 'Income') return showIncome();
  if (tab === 'Sessions') return showToday();
  if (tab === 'Groups') return showGroups();
  if (tab === 'To do') return showTodo();
  if (tab === 'Settings') return showSettings();
  refreshView = null; fetchedAt = null; showAge();
  document.getElementById('main').innerHTML = '<div class="soon">' + tab + ' comes in a later stage.</div>';
}

// Where a student page's Back button goes: the list you came from (Students, a group, Sessions or To do).
var BACK = { label: 'Students', tab: 'Students', fn: function () { showStudents(); } };
function setBack(label, tab, fn) { BACK = { label: label, tab: tab, fn: fn }; }
function goBack() { BACK.fn(); }

// ---------- Talking to the server ----------
// Screens open instantly from what the page already has (CACHE), then refresh in the background and redraw if
// anything changed. Anything that changes data (save, delete, payment) always goes to the server first, and the
// server re-checks the live data before acting, so nothing is ever saved from stale numbers.
var CACHE = {}, VIEW = 0, INFLIGHT = 0, FRESH_UNTIL = 0;
var WRITES = ['statementSent', 'reminderSent', 'transferSent', 'cancelStatement', 'markNotHeld', 'assignUpload', 'scanHomework', 'setHomework', 'updateGroup', 'setPastPapers', 'moveStudent', 'joinCreate', 'joinCancel', 'assignMeetPerson', 'addStudent', 'logSession', 'undoSession', 'importLogNow', 'updateStudent', 'undoStudentEdit', 'addAccount', 'confirmAccount', 'recordPayment', 'addAdjustment', 'setEntryDeleted'];
var STALE_WRITES = ['recordPayment', 'addAdjustment', 'setEntryDeleted', 'logSession', 'undoSession', 'addStudent', 'moveStudent', 'importLogNow', 'updateStudent', 'undoStudentEdit', 'addAccount', 'confirmAccount'];
var NO_CACHE = WRITES.concat(['health', 'todo', 'joinList', 'meetDraft', 'previewPayment', 'rate', 'prefetch', 'studentHistory']);

// Marks the start of a new screen; replies meant for an older screen are then ignored.
function newView() { VIEW++; refreshView = null; return VIEW; }

// Shows/hides the thin loading bar at the top. Only for things you're waiting for (a screen with nothing to show
// yet, or a save); quiet background refreshes never show it.
function busy(delta) {
  INFLIGHT = Math.max(0, INFLIGHT + delta);
  document.body.classList.toggle('loading', INFLIGHT > 0);
}

// Google's server answers slowly (and sometimes not at all) when it gets many requests at once, so requests go
// out at most two at a time: what you're waiting for first, background refreshes after.
var RUNNING = 0, QUEUE = [];
function send(job, urgent) {
  if (urgent) QUEUE.unshift(job); else QUEUE.push(job);
  pump();
}
function pump() {
  while (RUNNING < 2 && QUEUE.length) {
    var job = QUEUE.shift();
    RUNNING++;
    job(function () { RUNNING--; setTimeout(pump, 0); });
  }
}

// Saves the data cache on this device (a moment later, so it never slows a screen down).
var SAVE_T = null;
function persist() {
  clearTimeout(SAVE_T);
  SAVE_T = setTimeout(function () { if (typeof saveCache === 'function') saveCache(); }, 1500);
}

// ---------- Fast screens (Cloudflare read service) ----------
// Every screen's data is prepared by the server and uploaded to a fast read service; the app downloads it in a
// fraction of a second instead of asking Google for each screen. Right after a save, screens ask Google directly
// (as before) until the new data has been uploaded (usually within a minute).
var READ_URL = 'https://tutoring-hub.abdelrahmanzein.workers.dev';
var SNAP_ACTIONS = ['money', 'sessionForm', 'week', 'newStudentForm', 'income', 'groups', 'todo', 'group', 'profile', 'weekLive'];
var SNAP_AT = {}, STALE_SINCE = 0, SNAP_LOADING = null, POLL_T = null;

// Downloads the three blobs; redraws the screen you're on if anything changed.
function loadSnapshots() {
  if (SNAP_LOADING) return SNAP_LOADING;
  setRefreshing(true);
  var before = JSON.stringify(SNAP_AT);
  SNAP_LOADING = Promise.all(['core', 'live', 'profiles'].map(function (name) {
    return fetch(READ_URL + '/s/' + name, { headers: { Authorization: 'Bearer ' + TOKEN }, credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.data) return;
        SNAP_AT[name] = Date.parse(j.at);
        Object.keys(j.data).forEach(function (k) { CACHE[k] = { data: j.data[k], at: Date.now(), snap: true }; });
      }).catch(function () {});
  })).then(function () {
    SNAP_LOADING = null; setRefreshing(false); hideSplash();
    if (SNAP_AT.core) { fetchedAt = new Date(SNAP_AT.core); showAge(false); }
    if (STALE_SINCE && SNAP_AT.core > STALE_SINCE) STALE_SINCE = 0;
    if (SAVED_AT && SNAP_AT.core > SAVED_AT) { SAVED_AT = 0; clearInterval(POLL_T); }
    // Changes made on this phone that the downloaded data doesn't include yet are put back on top of it.
    PATCHES = PATCHES.filter(function (p) { return !(SNAP_AT.core > p.at + 5000); });
    PATCHES.forEach(function (p) { try { p.fn(); } catch (e) {} });
    persist();
    if (JSON.stringify(SNAP_AT) !== before && refreshView) { var y = window.scrollY; refreshView(); window.scrollTo(0, y); }
  });
  return SNAP_LOADING;
}

// After a save: the new data is uploaded within about a minute; it's checked every 15 s (for 3 minutes).
// Saves that change money or sessions also make screens ask Google directly until then (stale = true).
var SAVED_AT = 0;
function afterSave(stale) {
  SAVED_AT = Date.now();
  if (stale) STALE_SINCE = Date.now();
  if (!READ_URL) return;
  clearInterval(POLL_T);
  var tries = 0;
  POLL_T = setInterval(function () { if (++tries > 12 || !SAVED_AT) { clearInterval(POLL_T); SAVED_AT = 0; STALE_SINCE = 0; return; } loadSnapshots(); }, 15000);
}

// Local changes shown straight away (before the server's new data arrives). fn edits CACHE; it's applied now and
// again after each download until the download includes it.
var PATCHES = [];
function patchLocal(fn) {
  PATCHES.push({ at: Date.now(), fn: fn });
  try { fn(); } catch (e) {}
  persist();
}
function cached(action, args) { var c = CACHE[action + '|' + JSON.stringify(args || {})]; return c && c.data; }

// ---------- Saves through Cloudflare ----------
// Most saves are handed to the read service, which answers in a fraction of a second and passes them to Google
// (usually within a minute). The screen moves on at once; "Saving…" stays at the bottom until Google confirms,
// then "Saved ✓". If Google refuses one (e.g. the balance changed meanwhile), you get "Not saved: why".
var QUEUE_ACTIONS = ['setHomework', 'updateGroup', 'assignUpload', 'recordPayment', 'addAdjustment', 'setEntryDeleted', 'logSession',
  'undoSession', 'updateStudent', 'addAccount', 'confirmAccount', 'undoStudentEdit', 'moveStudent', 'joinCancel',
  'statementSent', 'reminderSent', 'transferSent', 'cancelStatement'];
var QUEUE_LABEL = { recordPayment: 'payment', addAdjustment: 'adjustment', logSession: 'session', undoSession: 'undo', updateStudent: 'student edit', setHomework: 'homework' };

function newId() {
  var a = new Uint8Array(12); (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
}

function queueSave(action, args, done, opts) {
  var id = newId(), clean = Object.assign({}, args); delete clean.fresh;
  savingMark(1);
  fetch(READ_URL + '/q', { method: 'POST', credentials: 'omit', headers: { Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: id, action: action, args: clean }) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function () {
      document.querySelectorAll('button[disabled]').forEach(function (b) { b.disabled = false; });
      if (opts.optimistic) opts.optimistic(); else done({ queued: true });
      waitForSave(id, action, opts);
    })
    .catch(function () {                                     // the read service is unreachable: save through Google directly
      savingMark(-1);
      var q = QUEUE_ACTIONS; QUEUE_ACTIONS = [];
      try { call(action, args, done, opts); } finally { QUEUE_ACTIONS = q; }
    });

// Checks for the outcome every 4 seconds (for up to 4 minutes).
function waitForSave(id, action, opts) {
  var tries = 0;
  var t = setInterval(function () {
    if (++tries > 60) { clearInterval(t); savingMark(-1); return notice('Still waiting for Google to save the ' + (QUEUE_LABEL[action] || 'change') + '. It will go through; check again in a few minutes.'); }
    fetch(READ_URL + '/r/' + id, { headers: { Authorization: 'Bearer ' + TOKEN }, credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r.pending) return;
        clearInterval(t);
        var d = r.data || {};
        if (!r.ok || d.conflict || d.changed || d.similar) {
          savingMark(-1);
          PATCHES = [];
          notice('Not saved: ' + (r.error || (d.changed ? 'the balance changed in the meantime. Check it and record the payment again.' :
            d.conflict ? 'it was changed elsewhere since you opened it. Open it again to see the latest values.' : 'please check and try again.')));
        } else {
          savingMark(-1, true);
          if (opts.confirmed) opts.confirmed(d);
        }
        loadSnapshots();                                      // the server uploaded the new data right after saving
      }).catch(function () {});
  }, 4000);
}

// A homework status changed on this phone: the To do list and the student's page show it at once.
function patchHomework(assignmentId, id, status) {
  patchLocal(function () {
    var t = cached('todo');
    if (t) t.homework.forEach(function (h) { if (h.assignmentId === assignmentId) h.missing = h.missing.filter(function (p) { return p.id !== id; }); });

    if (pr && pr.homework) pr.homework.forEach(function (h) { if (h.assignmentId === assignmentId && status) { h.status = status; h.manual = true; } });
  });
}

// The "Saving…" marker at the bottom while saves run in the background.
var SAVING = 0;
function savingMark(delta, done) {
  SAVING = Math.max(0, SAVING + delta);
  var el = document.getElementById('saving');
  if (!el) { el = document.createElement('div'); el.id = 'saving'; document.body.appendChild(el); }
  el.className = SAVING ? 'on' : done ? 'on ok' : '';
  el.textContent = SAVING ? 'Saving' + (SAVING > 1 ? ' ' + SAVING + ' changes' : '') + '…' : done ? 'Saved ✓' : '';
  if (!SAVING) setTimeout(function () { if (!SAVING) el.className = ''; }, 1800);
}

// Refresh: download now, and ask Google to rebuild everything (picks up changes typed into the Sheet), then download again.
function refreshFromServer() {
  loadSnapshots();
  setRefreshing(true);
  google.script.run.withSuccessHandler(function () { setRefreshing(false); loadSnapshots(); })
    .withFailureHandler(function () { setRefreshing(false); showAge(true); }).api(TOKEN, 'publishNow', {});
  google.script.run.withSuccessHandler(function () { loadSnapshots(); }).withFailureHandler(function () {}).api(TOKEN, 'refreshLive', {});
}

// Calls the server. opts.form: draw once only (never redraw a form the user is typing in). opts.part: a piece of a screen.
function call(action, args, done, opts) {
  opts = opts || {};
  var key = action + '|' + JSON.stringify(args || {}), myView = VIEW, cached = CACHE[key];
  // Fast path: straight from the read service's data (waits for the first download if it's still coming).
  if (READ_URL && !STALE_SINCE && SNAP_ACTIONS.indexOf(action) >= 0 && !(args && args.fresh)) {
    if (cached && cached.snap) { hideSplash(); return done(cached.data); }
    if (SNAP_LOADING && !opts.retried) {
      if (cached) { hideSplash(); return done(cached.data); }      // saved on this device; redrawn when the download lands
      if (!opts.part) document.getElementById('main').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
      return SNAP_LOADING.then(function () { if (myView === VIEW || opts.part) call(action, args, done, Object.assign({}, opts, { retried: true })); });
    }
  }
  var cacheable = NO_CACHE.indexOf(action) < 0, fresh = Date.now() < FRESH_UNTIL, isWrite = WRITES.indexOf(action) >= 0;
  var shown = false;
  if (cacheable && cached) {
    hideSplash(); done(cached.data); shown = true;
    // Data younger than two minutes is not asked for again (saves are always checked live on the server anyway).
    if (!fresh && cached.at && Date.now() - cached.at < 120000) return;
  }
  else if (!opts.part && cacheable) document.getElementById('main').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  if (fresh && cacheable) args = Object.assign({}, args, { fresh: true });
  var waiting = !shown && !isWrite;           // you're looking at a skeleton or a form waiting
  if (isWrite && READ_URL && QUEUE_ACTIONS.indexOf(action) >= 0) return queueSave(action, args, done, opts);
  if (isWrite) savingMark(1);
  send(function (finish) {
    if (waiting) busy(1);
    if (shown) setRefreshing(true);
    google.script.run.withSuccessHandler(function (res) {
      if (waiting) busy(-1); if (shown) setRefreshing(false); finish();
      fetchedAt = new Date(res.fetchedAt); showAge(false);
      if (isWrite) {
        savingMark(-1, true);
        var stale = STALE_WRITES.indexOf(action) >= 0;
        if (stale) staleAll();
        afterSave(stale);
        // Optimistic saves already updated the screen; others continue where you are (or just confirm if you moved on).
        if (opts.optimistic) { if (opts.confirmed) opts.confirmed(res.data); return; }
        if (myView !== VIEW) { notice('Saved ✓'); if (stale && refreshView) refreshView(); return; }
        return done(res.data);
      }
      hideSplash();
      if (!cacheable) return done(res.data);
      var changed = !cached || JSON.stringify(cached.data) !== JSON.stringify(res.data);
      CACHE[key] = { data: res.data, at: Date.now() }; persist();
      if (cached && (opts.form || !changed || myView !== VIEW)) return;
      if (myView === VIEW || opts.part) done(res.data);
    }).withFailureHandler(function (err) {
      if (waiting) busy(-1); if (shown) setRefreshing(false); finish(); hideSplash();
      document.querySelectorAll('button[disabled]').forEach(function (b) { b.disabled = false; });
      if (isWrite) {
        savingMark(-1);
        if (opts.optimistic) { PATCHES = []; loadSnapshots(); }       // undo the on-screen change
        return notice('Not saved: ' + err.message);
      }
      if (shown) return showAge(true);                                  // keep what's on screen; the header says it couldn't refresh
      if (isWrite || !cacheable || opts.part) notice(err.message);
      else if (myView === VIEW) document.getElementById('main').innerHTML = '<div class="error">' + esc(err.message) + '</div>';
    }).api(TOKEN, action, args);
  }, waiting || isWrite);
  if (isWrite && opts.optimistic) opts.optimistic();
}

// After a save, every screen's data is marked old (shown at once, refreshed in the background when opened).
function staleAll() {
  Object.keys(CACHE).forEach(function (k) { CACHE[k].at = 0; });
}

// "updating…" in the header while a screen refreshes quietly.
var REFRESHING = 0;
function setRefreshing(on) {
  REFRESHING = Math.max(0, REFRESHING + (on ? 1 : -1));
  showAge();
}

// Fades out the opening logo once the first screen has data (or after 8 seconds at most).
function hideSplash() {
  var el = document.getElementById('splash');
  if (!el || el.classList.contains('gone')) return;
  el.classList.add('gone');
  setTimeout(function () { el.remove(); }, 400);
}

// Loads every screen's data in one go, in the background, so moving around is instant. Skipped if done in the
// last 10 minutes (Refresh forces it).
function prefetch(fresh) {
  var last = 0; try { last = Number(localStorage.getItem('th_prefetched') || 0); } catch (e) {}
  if (!fresh && Date.now() - last < 600000) return;
  send(function (finish) {
    google.script.run.withSuccessHandler(function (res) {
      finish();
      var d = res.data, at = Date.now();
      try { localStorage.setItem('th_prefetched', String(at)); } catch (e) {}
      CACHE['money|{}'] = { data: d.money, at: at };
      CACHE['sessionForm|{}'] = { data: d.sessionForm, at: at };
      CACHE['week|{}'] = { data: d.week, at: at };
      CACHE['newStudentForm|{}'] = { data: d.newStudentForm, at: at };
      Object.keys(d.profiles).forEach(function (id) {
        CACHE['profile|' + JSON.stringify({ id: id })] = { data: d.profiles[id], at: 0 };     // profiles still fetch the full ledger once
      });
      persist();

      ['income', 'weekLive', 'groups'].forEach(function (a) {
        send(function (fin) {
          google.script.run.withSuccessHandler(function (r) { fin(); CACHE[a + '|{}'] = { data: r.data, at: Date.now() }; persist(); })
            .withFailureHandler(function () { fin(); }).api(TOKEN, a, fresh ? { fresh: true } : {});
        });
      });
    }).withFailureHandler(function () { finish(); }).api(TOKEN, 'prefetch', fresh ? { fresh: true } : {});
  });

// Disables a button and shows "Saving…" so it can't be pressed twice.
function hold(btn, label) {

}

// "updated 3 min ago" in the header ("updating…" while refreshing; "couldn't refresh" after a failed try).
var REFRESH_FAILED = false;
function showAge(failed) {
  if (failed !== undefined) REFRESH_FAILED = failed;
  var el = document.getElementById('updated');
  if (REFRESHING) { el.textContent = 'updating…'; return; }
  if (REFRESH_FAILED) { el.textContent = 'couldn\'t refresh, tap Refresh'; return; }
  if (!fetchedAt) { el.textContent = ''; return; }
  var min = Math.round((Date.now() - fetchedAt.getTime()) / 60000);
  el.textContent = min < 1 ? 'updated just now' : 'updated ' + min + ' min ago';
}

// Shows a message bar at the top of the page (alert() does not work inside Apps Script pages).
function notice(msg) {

  if (!el) {
    el = document.createElement('div'); el.id = 'notice';
    el.style.cssText = 'position:fixed;top:60px;left:16px;right:16px;z-index:20;background:var(--card);border:1px solid var(--warn);color:var(--text);border-radius:12px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.2)';
    el.onclick = function () { el.style.display = 'none'; };

// The moment "yyyy-mm-dd" + "HH:MM" Cairo time happens, whatever time zone the phone is in.
function cairoTime(day, hhmm) {
  var guess = new Date(day + 'T' + (hhmm || '00:00') + ':00Z').getTime() - 2 * 3600e3;
  var fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  for (var i = 0; i < 2; i++) {
    var p = {}; fmt.formatToParts(new Date(guess)).forEach(function (x) { p[x.type] = x.value; });
    var shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute), want = new Date(day + 'T' + (hhmm || '00:00') + ':00Z').getTime();
    guess += want - shown;
  }
  return new Date(guess);
}

// 2026-10-06 -> 06/10/2026 (dates are shown day/month/year everywhere).
function fmtDate(v) {

}

  var parts = [];
  if (egp) parts.push(amt(egp, 'EGP'));
  if (usd) parts.push(amt(usd, 'USD'));
  return parts.join(' · ') || '–';
}

// "2026-10" -> "Oct" (or "October 2026" when long).
function monthName(ym, long) {
  var names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var p = ym.split('-'), n = names[Number(p[1]) - 1];
  return long ? n + ' ' + p[0] : n.slice(0, 3);
}

// Short number for bar labels: 123,463 -> 123k, 1,380 -> 1.4k, 595 -> 595.
function shortNum(n) {
  n = Math.round(n);
  if (Math.abs(n) >= 100000) return Math.round(n / 1000) + 'k';
  if (Math.abs(n) >= 1000) return (Math.round(n / 100) / 10) + 'k';
  return String(n);
}

// One bar per month (single series, so no legend), with the value above every bar.
function barChart(months, key, cur, title) {
  var max = Math.max.apply(null, months.map(function (m) { return m[key]; }).concat([1]));
  var pill = cur === 'TOTAL' ? '<span class="cur TOTAL">EGP + USD</span>' : '<span class="cur ' + cur + '">' + cur + '</span>';
  return '<div class="card"><div class="sub">' + pill + ' ' + title + '</div><div class="bars">' +
    months.map(function (m) {
      var h = Math.round(m[key] / max * 100);
      return '<div class="bar-col" title="' + monthName(m.month, true) + ': ' + amt(m[key], cur === 'TOTAL' ? 'EGP' : cur) + '">' +
        '<div class="bar-val">' + (m[key] ? shortNum(m[key]) : '') + '</div>' +
        '<div class="bar ' + cur + '" style="height:' + Math.max(h, m[key] ? 2 : 0) + '%"></div><div class="bar-lbl">' + monthName(m.month).slice(0, 1) + '</div></div>';
    }).join('') + '</div></div>';
}

// A <select> with [value, label] options.
function sel(id, value, options) {
  return '<select id="' + id + '">' + options.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === value ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
}

// Sort key: bigger debt first (EGP and USD roughly comparable by sessions owed).
function owedScore(s) {
  return Object.keys(s.money).reduce(function (n, c) { return n + s.money[c].sessionsOwed; }, 0);
}

// Old entry points now open the merged profile.
function showMoneyStudent(id) { showProfile(id); }

// Delete or restore an entry, with an in-page confirmation (second tap).
var pendingToggle = '';
function toggleEntry(entryId, deleted, studentId) {
  if (deleted && pendingToggle !== entryId) {
    pendingToggle = entryId;
    return notice('Deleting ' + entryId + ' re-opens whatever it covered (a deleted payment makes sessions unpaid again). Tap Delete again to confirm.');
  }
  pendingToggle = '';
  call('setEntryDeleted', { entryId: entryId, deleted: deleted }, function () { showMoneyStudent(studentId); });
}

// Record payment form.
var PAY_PRE = null;
function paymentForm(id, pre) {
  PAY_PRE = pre || null;
  newView();
  call('moneyStudent', { id: id }, function (d) {
    var st = d.student;
    document.getElementById('main').innerHTML = testBar(d.testMode) + '<button class="back" onclick="showMoneyStudent(\'' + esc(id) + '\')">‹ Cancel</button><h2>Record payment · ' + esc(st.name) + '</h2>' +
      '<div class="card">' +
      '<div class="sub">Amount the family sent</div><input id="pa" type="number" step="any" min="0" inputmode="decimal">' +
      '<div class="sub" style="margin-top:8px">Currency</div><select id="pc" onchange="rateBox()"><option>EGP</option><option>USD</option></select>' +
      '<div id="rb"></div>' +
      '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer"><input type="checkbox" id="short" style="width:auto" onchange="document.getElementById(\'arr\').style.display=this.checked?\'block\':\'none\'"> Arrived short in my bank (fees deducted)</label>' +
      '<div id="arr" style="display:none"><div class="sub" style="margin-top:8px">Amount that actually arrived</div><input id="parr" type="number" step="any" min="0" inputmode="decimal"></div>' +
      '<div class="sub" style="margin-top:8px">Date</div><input id="pd" type="date" value="' + today() + '">' +
      '<div class="sub" style="margin-top:8px">Note (optional)</div><input id="pn"></div>' +
      '<button class="primary" style="margin-top:10px" onclick="checkPayment(\'' + esc(id) + '\',\'' + esc(st.currency) + '\')">Check</button><div id="pv"></div>';
    document.getElementById('pc').value = /paid as EGP/i.test(st.paymentType) ? 'EGP' : st.currency;
    // Started from a payment text or a request: amount, currency and reference filled in.
    if (PAY_PRE) {
      if (PAY_PRE.amount) document.getElementById('pa').value = PAY_PRE.amount;
      if (PAY_PRE.currency) document.getElementById('pc').value = PAY_PRE.currency;
      if (PAY_PRE.note) document.getElementById('pn').value = PAY_PRE.note;
      if (PAY_PRE.date) document.getElementById('pd').value = PAY_PRE.date;
    }
    rateBox(st.currency);
  }, { form: true });
}

// Shows the rate box when the money arrives in a different currency from the student's rate currency.
function rateBox(studentCur) {
  window.studentCur = studentCur || window.studentCur;
  var c = document.getElementById('pc').value, box = document.getElementById('rb');
  if (c === window.studentCur) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="sub" id="rhint" style="margin-top:8px">Getting today\'s reference rate…</div>' +
    '<input id="prate" type="number" step="any" inputmode="decimal" style="display:none;margin-top:6px" placeholder="EGP per $1">';
  call('rate', {}, function (r) {
    window.refRate = r.rate;
    var hint = document.getElementById('rhint');
    if (r.rate) {
      document.getElementById('prate').value = r.rate;
      hint.innerHTML = 'Converted at today\'s reference rate (' + r.rate + ' EGP per $1). <a href="#" onclick="document.getElementById(\'prate\').style.display=\'block\';return false">Use another rate</a>';
    } else {
      hint.textContent = 'Could not get the reference rate. Type the rate:';
      document.getElementById('prate').style.display = 'block';
    }
  });
}

// Works out the amount in the student's currency (converting with the rate if needed) and asks the server what it would cover.
function checkPayment(id, studentCur) {
  var received = Number(document.getElementById('pa').value), cur = document.getElementById('pc').value, rate = 0, amount = received;
  if (!(received > 0)) return notice('Enter the amount received.');
  if (cur !== studentCur) {
    rate = Number(document.getElementById('prate').value);
    if (!(rate > 0)) return notice('Enter the rate.');
    amount = studentCur === 'USD' ? Math.round(received / rate * 100) / 100 : Math.round(received * rate * 100) / 100;
  }
  var args = { id: id, amount: amount, currency: studentCur, date: document.getElementById('pd').value, rate: rate || '', egpReceived: cur === 'EGP' && cur !== studentCur ? received : '' };
  var arrived = document.getElementById('short').checked ? Number(document.getElementById('parr').value) : received;
  if (!(arrived > 0) || arrived > received) return notice('Enter the amount that arrived (less than or equal to what was sent).');
  var fee = Math.round((received - arrived) * 100) / 100;
  call('previewPayment', args, function (p) {
    document.getElementById('pv').innerHTML = '<div class="card">' +
      (cur !== studentCur
        ? (p.rounding
          ? '<div>' + amt(received, cur) + ' → <b>' + amt(p.credited, studentCur) + '</b> credited</div><div class="sub">That is ' + p.impliedRate + ' EGP per $1 (reference ' + rate + ', ' + pctDiff(p.impliedRate, rate) + '): close enough, so the sessions are settled exactly.</div>'
          : '<div>' + amt(received, cur) + ' at ' + rate + ' = <b>' + amt(p.credited, studentCur) + '</b> credited</div>' +
            '<div class="tag warn">Not a whole number of sessions at this rate: the difference stays on the account.</div>')
        : '<div><b>' + amt(amount, studentCur) + '</b></div>') +
      (fee ? '<div class="sub">Arrived ' + amt(arrived, cur) + ': bank fee ' + amt(fee, cur) + ' (you absorb it; the family is credited in full)</div>' : '') +
      '<div class="sub">Balance ' + amt(p.before, studentCur) + ' → ' + amt(p.after, studentCur) + '</div>' +
      '<div>Covers: ' + (p.covers.length ? p.covers.map(function (c) { return esc(c); }).join(', ') : 'no whole session') + '</div>' +
      (p.creditAfter ? '<div>Credit left after: ' + amt(p.creditAfter, studentCur) + '</div>' : '') +
      (p.owedAfter ? '<div>Still owed: ' + amt(p.owedAfter, studentCur) + ' (' + p.sessionsStillUnpaid + ' sessions)</div>' : '') +
      '</div><button class="primary" onclick=\'hold(this);savePayment(' + JSON.stringify(Object.assign({}, args, {
        note: document.getElementById('pn').value, receivedCurrency: cur, sentAmount: received, arrivedAmount: arrived, bankFee: fee,
        reference: PAY_PRE && PAY_PRE.reference || '', smsKey: PAY_PRE && PAY_PRE.smsKey || '',
        expectedBalance: p.before })) + ')\'>Confirm and save</button>';
  });
}

// "+0.1%" style difference between two rates.
function pctDiff(a, b) { var d = Math.round((a - b) / b * 1000) / 10; return (d >= 0 ? '+' : '') + d + '%'; }

// Saves the payment. If the balance changed in the meantime the new numbers are shown and nothing is saved.
function savePayment(args) {
  // A payment from a forwarded text: the text is cleared from To do once the payment is handed over.
  if (args.smsKey) { forgetSms(args.smsKey); delete args.smsKey; }
  call('recordPayment', args, function (r) {
    if (r.queued) { showMoneyStudent(args.id); return notice('Payment sent. The balance updates in about a minute.'); }
    if (r.changed) { notice('The balance changed since you checked (' + amt(r.now.before, args.currency) + '). Check again.'); return checkPayment(args.id, args.currency); }
    showMoneyStudent(args.id); notice('Payment saved (' + r.saved + ').');
  });
}

// Adjustment or refund form.
function adjustForm(id) {
  newView();
  call('moneyStudent', { id: id }, function (d) {
    document.getElementById('main').innerHTML = testBar(d.testMode) + '<button class="back" onclick="showMoneyStudent(\'' + esc(id) + '\')">‹ Cancel</button><h2>Waive, correct or refund · ' + esc(d.student.name) + '</h2>' +
      '<div class="card sub" style="font-size:14px">Use this only when the balance must change <b>without</b> a normal payment:<br>' +
      '• <b>Waive</b>: forgive an amount (e.g. a discount, or a session you decide not to charge). Enter it as a <b>plus</b> amount.<br>' +
      '• <b>Correct</b>: fix a wrong balance (e.g. a mistake carried from the old sheet). Plus lowers what they owe, minus adds to it.<br>' +
      '• <b>Refund</b>: money you paid back to the family (e.g. unused credit when a student leaves).<br>' +
      'To cancel one session completely, it is simpler to delete its charge in the ledger.</div>' +
      '<div class="card"><div class="sub">What is it?</div><select id="at2"><option value="Adjustment">Waive or correct</option><option value="Refund">Refund (money paid back)</option></select>' +
      '<div class="sub" style="margin-top:8px">Amount</div><input id="aa" type="number" step="any" inputmode="decimal">' +
      '<div class="sub" style="margin-top:8px">Currency</div><select id="ac"><option>EGP</option><option>USD</option></select>' +
      '<div class="sub" style="margin-top:8px">Date</div><input id="ad" type="date" value="' + today() + '">' +
      '<div class="sub" style="margin-top:8px">Reason (required, kept in the ledger)</div><input id="ar"></div>' +
      '<button class="primary" style="margin-top:10px" onclick="hold(this);saveAdjust(\'' + esc(id) + '\')">Save</button>';
    document.getElementById('ac').value = d.student.currency;
  }, { form: true });
}

// Saves the adjustment.
function saveAdjust(id) {
  call('addAdjustment', { id: id, type: document.getElementById('at2').value, amount: document.getElementById('aa').value, currency: document.getElementById('ac').value,
    date: document.getElementById('ad').value, reason: document.getElementById('ar').value }, function (r) { showMoneyStudent(id); if (!r.queued) notice('Saved (' + r.saved + ').'); });
}
</script>

  <script>
// ---------- Students: one roster for everyone, one profile per student ----------
var RF = { q: '', g: '', money: '', cur: '', o: 'owed' };     // roster search, filters and sort (remembered on this device)
try { var savedRF = JSON.parse(localStorage.getItem('th_roster') || 'null'); if (savedRF) RF = savedRF; } catch (e) { /* ignore */ }
var rosterData = null;

// Keeps the roster choices for next time.
function saveRF() { try { localStorage.setItem('th_roster', JSON.stringify(RF)); } catch (e) { /* ignore */ } }

// Recently opened students (newest first, up to 5).
function recentIds() { try { return JSON.parse(localStorage.getItem('th_recent') || '[]'); } catch (e) { return []; } }
function rememberRecent(id) {
  var list = recentIds().filter(function (x) { return x !== id; });
  list.unshift(id);
  try { localStorage.setItem('th_recent', JSON.stringify(list.slice(0, 5))); } catch (e) { /* ignore */ }
}

// Opens the roster with some filters set (e.g. from Income: who owes).
function goRoster(filters) {
  RF.q = ''; RF.g = ''; RF.money = filters.s === 'owes' ? 'owes' : (filters.s || ''); RF.cur = filters.c || '';
  saveRF();
  openTab('Students');
}

// The roster screen.
function showStudents() {
  setBack('Students', 'Students', showStudents);
  newView();
  refreshView = showStudents;
  document.getElementById('title').textContent = 'Students';
  call('money', {}, function (d) {
    rosterData = d;
    var groups = {};
    d.students.forEach(function (s) { if (s.group) groups[s.group] = 1; });
    var chip = function (key, value, label) {
      return '<button class="chip' + (RF[key] === value ? ' on' : '') + '" onclick="toggleChip(\'' + key + '\',\'' + value + '\')">' + label + '</button>';
    };
    var byId = {};
    d.students.forEach(function (s) { byId[s.id] = s; });
    var recent = recentIds().filter(function (id) { return byId[id]; });
    document.getElementById('main').innerHTML = testBar(d.testMode) +
      '<div class="actions" style="margin-top:0"><button class="primary" onclick="newStudentForm()">＋ New student</button></div>' +
      '<div id="joins"></div>' +
      '<input id="rq" placeholder="Search name (English or Arabic)" value="' + esc(RF.q) + '">' +
      '<div class="chips">' + chip('money', 'owes', 'Owes money') + chip('money', 'credit', 'Has credit') +
      chip('cur', 'EGP', '<span class="cur EGP">EGP</span>') + chip('cur', 'USD', '<span class="cur USD">USD</span>') + '</div>' +
      '<div class="filters">' + sel('rg', RF.g, [['', 'All groups']].concat(Object.keys(groups).sort().map(function (g) { return [g, g]; }))) +
      sel('ro', RF.o, [['owed', 'Most sessions owed'], ['name', 'Name A–Z'], ['oldest', 'Oldest last payment'], ['group', 'Group']]) + '</div>' +
      (recent.length ? '<div class="recent"><span class="sub">Recent:</span> ' + recent.map(function (id) {
        return '<button class="chip" onclick="showProfile(\'' + esc(id) + '\')">' + esc(byId[id].name.split(' ')[0] + ' ' + (byId[id].name.split(' ')[1] || '').slice(0, 1)) + '</button>';
      }).join('') + '</div>' : '') +
      '<div id="rlist"></div>';
    drawJoins();
    document.getElementById('rq').oninput = function () { RF.q = this.value; saveRF(); drawRoster(); };
    document.getElementById('rg').onchange = function () { RF.g = this.value; saveRF(); drawRoster(); };
    document.getElementById('ro').onchange = function () { RF.o = this.value; saveRF(); drawRoster(); };
    drawRoster();
  });
}

// Turns a filter chip on or off (chips in the same row exclude each other).
function toggleChip(key, value) {
  RF[key] = RF[key] === value ? '' : value;
  saveRF();
  showStudents();
}

// The money state of a roster row: 'owes', 'credit' or 'settled'.
function moneyState(s) {
  var ks = Object.keys(s.money);
  if (ks.some(function (c) { return s.money[c].owed; })) return 'owes';
  if (ks.some(function (c) { return s.money[c].credit; })) return 'credit';
  return 'settled';
}

// The newest payment of a roster row, if any.
function lastPaid(s) {
  return Object.keys(s.money).map(function (c) { return s.money[c].lastPayment; }).filter(Boolean)
    .sort(function (a, b) { return String(b.date).localeCompare(a.date); })[0];
}

// Draws the roster cards that match the search, chips and group, in the chosen order.
function drawRoster() {
  var q = RF.q.toLowerCase();
  var rows = rosterData.students.filter(function (s) {
    return (!q || (s.name + ' ' + (s.arabic || '')).toLowerCase().indexOf(q) >= 0) && (!RF.g || s.group === RF.g) &&
      (!RF.cur || s.currency === RF.cur) && (!RF.money || moneyState(s) === RF.money);
  });
  rows.sort(function (a, b) {
    if (RF.o === 'name') return a.name.localeCompare(b.name);
    if (RF.o === 'group') return String(a.group).localeCompare(String(b.group)) || a.name.localeCompare(b.name);
    if (RF.o === 'oldest') return String((lastPaid(a) || {}).date || '').localeCompare(String((lastPaid(b) || {}).date || ''));
    return owedScore(b) - owedScore(a) || a.name.localeCompare(b.name);
  });
  var owedE = 0, owedU = 0;
  rows.forEach(function (s) { if (s.money.EGP) owedE += s.money.EGP.owed; if (s.money.USD) owedU += s.money.USD.owed; });
  var rate = rosterData.rate || 0;
  var totals = (owedE || owedU) ? ' · owe ' + both(owedE, owedU) + (owedE && owedU && rate ? ' ≈ <b>' + amt(Math.round(owedE + owedU * rate), 'EGP') + '</b>' : '') : '';
  document.getElementById('rlist').innerHTML = '<div class="sub" style="margin:0 0 6px">' + rows.length + ' student' + (rows.length === 1 ? '' : 's') + totals + '</div>' + rows.map(function (s) {
    var tags = Object.keys(s.money).map(function (c) {
      var m = s.money[c];
      if (m.owed) return '<span class="tag owe">owes ' + amt(m.owed, c) + ' · ' + m.sessionsOwed + ' session' + (m.sessionsOwed === 1 ? '' : 's') + '</span>';
      if (m.credit) return '<span class="tag good">credit ' + amt(m.credit, c) + '</span>';
      return '';
    }).join(' ');
    var last = lastPaid(s);
    return '<div class="card item cur-' + esc(s.currency) + '" onclick="showProfile(\'' + esc(s.id) + '\')"><div><div><span class="cur ' + esc(s.currency) + '">' + esc(s.currency) + '</span> ' + esc(s.name) +
      (s.status !== 'Active' ? ' <span class="tag warn">' + esc(s.status) + '</span>' : '') + '</div>' +
      '<div class="sub">' + esc(s.group || 'No group') + (last ? ' · last paid ' + fmtDate(last.date) : ' · no payments yet') + '</div></div>' +
      '<div class="right">' + (tags || '<span class="tag">settled</span>') + '</div><span class="chev">›</span></div>';
  }).join('') || '<div class="soon">No students match.</div>';
}

    if (join) {
      var a = join.answers, put = function (id, v) { var el = document.getElementById(id); if (el && v) el.value = v; };

  <script>

        }).join('') : '<div class="card sub">No sessions in the Tutoring calendar for the next 7 days.</div>') +
        (d.source === 'App'

            '<div class="actions"><button onclick="hold(this,\'Importing…\');importNow()">Import new sessions now</button></div></div>');

var WEEK = [];

// The prepared data can be some minutes old, so the time-based status is worked out again from the clock here.

    '<div id="nhmk" style="display:none"><div class="filters" style="margin:6px 0 0"><input id="nhd" type="date" value="' + today() + '"><input id="nht" type="time" value="' + esc(s.start || '19:00') + '"></div>' +

// "2026-10-08 23:59" -> "Thu 8 Oct, 11:59 PM".
function dueLabel(v) {
  var m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return v;
  var d = new Date(+m[1], +m[2] - 1, +m[3]);
  return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] + ' ' + d.getDate() + ' ' +
    ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()] + ', 11:59 PM';
}

// "2026-10-07" -> "Today", "Tomorrow" or "Friday 9 Oct".
function dayLabel(day) {
  var d = new Date(day + 'T12:00:00'), now = new Date();
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 12);
  var diff = Math.round((d - t) / 864e5);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()] + ' ' + d.getDate() + ' ' +
    ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()];
}

// Pulls new session rows from the Log Sheet right away.

// Asks Meet who came (takes a few seconds), then fills the student lines.
function loadMeet() {
  if (!sessEvent) return;
  document.getElementById('smeet').innerHTML = '<div class="card sub">Reading Meet…</div>';
  call('meetDraft', { eventId: sessEvent, day: document.getElementById('sd').value, group: document.getElementById('sg').value }, function (m) {
    sessMeet = m; applyMeet(); drawMeetBox(); drawSessionRows();
  }, { part: true });
}

// Puts Meet's answer into the student lines (Meet absent -> Absent, charged); visiting students Meet saw are added.
function applyMeet() {
  if (!sessMeet || !sessMeet.held) return;
  sessMeet.rows.forEach(function (m) {
    var r = sessRows.filter(function (x) { return x.id === m.id; })[0];
    if (!r && m.attended) {
      var p = sessData.people.filter(function (x) { return x.id === m.id; })[0];
      if (!p) return;
      r = { id: p.id, name: p.name, currency: p.currency, amount: p.rate, visiting: true, notes: [] };
      sessRows.push(r);
    }
    if (!r) return;
    r.meet = m; r.status = m.attended ? 'Attended' : 'Absent';
    if (m.participation && !r.participation) r.participation = m.participation;
  });
}

// The Meet summary card, with "who is this?" for anyone Meet saw but couldn't match.
function drawMeetBox() {
  var box = document.getElementById('smeet'), m = sessMeet;
  if (!box) return;
  if (!m) { box.innerHTML = ''; return; }
  if (!m.held) { box.innerHTML = '<div class="card sub">Meet has no record of this session (yet). Fill in attendance by hand.</div>'; return; }
  box.innerHTML = '<div class="card"><div class="sub">From Meet: first student let in at ' + esc(String(m.firstAdmitted).slice(11)) +
    (m.hasTranscript ? ' · participation suggested from the transcript' : ' · no transcript, so pick participation yourself') + '. Change anything below.</div>' +
    m.unknown.map(function (u, k) {
      return '<div class="item" style="margin-top:8px"><div><b>Who is this?</b> ' + esc(u.name) + (u.suggest ? '<div class="sub">Probably ' + esc(u.suggestName) + ' (the only one without a Meet account yet)</div>' : '') + '</div></div><div class="filters" style="margin:6px 0 0">' +
        sel('wk' + k, u.suggest || '', [['', 'Pick the student']].concat(sessData.people.map(function (p) { return [p.id, p.name]; }))) +
        '<button onclick="hold(this);assignWho(' + k + ')">Save</button></div>';
    }).join('') + '</div>';
}

// Links an unknown Meet person to a student, then reads Meet again.
function assignWho(k) {
  var u = sessMeet.unknown[k], id = document.getElementById('wk' + k).value;
  if (!id) return notice('Pick the student first.');
  call('assignMeetPerson', { id: id, meetId: u.id, name: u.name }, function () { notice(u.name + ' is now linked.'); loadMeet(); });
}

// True if a membership covers the date.
function inGroupOn(m, group, date) {
  return m.group === group && (!m.since || m.since <= date) && (!m.until || m.until >= date);
}

// Builds the student lines for the chosen group and date.
function fillSessionRows() {
  var g = document.getElementById('sg').value, date = document.getElementById('sd').value;
  if (!g) { document.getElementById('srows').innerHTML = ''; return; }
  sessRows = sessData.people.filter(function (p) { return p.memberships.some(function (m) { return inGroupOn(m, g, date); }); })
    .map(function (p) { return { id: p.id, name: p.name, currency: p.currency, amount: p.rate, status: 'Attended', visiting: false, notes: [] }; });
  applyMeet();
  drawSessionRows();
}

var PARTICIPATION = ['Very active', 'Active', 'Occasional', 'Quiet'];
var TEACHER_NOTES = ['Understood well', 'Solved well', 'Good questions', 'Explained to others', 'Well prepared', 'Struggled', 'Needs more practice', 'Not prepared', 'Distracted', 'Camera off'];

// What Meet saw for one student, in one short line.
function meetLine(m) {
  if (!m) return '';
  if (!m.attended) return '<div class="sub">Meet: not seen</div>';
  return '<div class="sub">Meet: joined ' + esc(String(m.joinedAt).slice(11)) + (m.minutesLate ? ' · <b>' + m.minutesLate + ' min late</b>' : ' · on time') +
    ' · ' + m.minutesInClass + ' min' + (m.contributions !== '' ? ' · ' + m.contributions + ' contributions, ' + m.questions + ' questions' : '') + '</div>';
}

// Draws the student lines (status, amount, participation, teacher notes) and the save button.
function drawSessionRows() {
  var others = sessData.people.filter(function (p) { return !sessRows.some(function (r) { return r.id === p.id; }); });
  document.getElementById('srows').innerHTML = '<h2>' + sessRows.length + ' students</h2>' + sessRows.map(function (r, i) {
    return '<div class="card cur-' + esc(r.currency) + '"><div><span class="cur ' + esc(r.currency) + '">' + esc(r.currency) + '</span> <b>' + esc(r.name) + '</b>' + (r.visiting ? ' <span class="tag">visiting</span>' : '') + '</div>' +
      meetLine(r.meet) +
      '<div class="filters" style="margin:8px 0 0">' +
      '<select onchange="sessRows[' + i + '].status=this.value">' + ['Attended', 'Absent', 'Not charged'].map(function (s) {
        return '<option value="' + s + '"' + (r.status === s ? ' selected' : '') + '>' + (s === 'Absent' ? 'Absent (charged)' : s) + '</option>';
      }).join('') + '</select>' +
      '<input type="number" step="any" inputmode="decimal" value="' + esc(r.amount) + '" onchange="sessRows[' + i + '].amount=this.value" style="max-width:120px">' +
      '<select onchange="sessRows[' + i + '].participation=this.value"><option value="">Participation…</option>' + PARTICIPATION.map(function (p) {
        return '<option' + (r.participation === p ? ' selected' : '') + '>' + p + '</option>';
      }).join('') + '</select></div>' +
      '<div class="chips">' + TEACHER_NOTES.map(function (n) {
        return '<button class="chip' + (r.notes.indexOf(n) >= 0 ? ' on' : '') + '" onclick="toggleNote(' + i + ',this)">' + n + '</button>';
      }).join('') + '</div>' +
      '<input placeholder="Note about ' + esc(r.name.split(' ')[0]) + ' (optional)" value="' + esc(r.freeNote || '') + '" onchange="sessRows[' + i + '].freeNote=this.value" style="width:100%;margin-top:6px"></div>';
  }).join('') +
    '<div class="filters">' + sel('sadd', '', [['', '＋ Add a visiting student']].concat(others.map(function (p) { return [p.id, p.name]; }))) + '</div>' +
    '<button class="primary" style="width:100%;margin-top:6px" onclick="hold(this);saveSession()">Save session and charges</button>';
  document.getElementById('sadd').onchange = function () {
    var p = sessData.people.filter(function (x) { return x.id === this.value; }, this)[0];
    if (p) { sessRows.push({ id: p.id, name: p.name, currency: p.currency, amount: p.rate, status: 'Attended', visiting: true, notes: [] }); drawSessionRows(); }
  };

// Turns a teacher-note chip on or off.
function toggleNote(i, btn) {

  if (k >= 0) list.splice(k, 1); else list.push(n);

// Saves the session; the server refuses a second log of the same group and date.
function saveSession() {
  var args = { group: document.getElementById('sg').value, date: document.getElementById('sd').value, title: document.getElementById('st').value,
    noteNext: document.getElementById('sn').value, rows: sessRows, eventId: sessEvent || '', sessionId: SESS_ID, meetHeld: sessMeet ? sessMeet.held : undefined };
  call('logSession', args, function (r) {
    if (r.queued) {
      var sid = args.sessionId || args.date + ' ' + args.group;
      patchLocal(function () {
        var w = cached('week'); if (w) w.forEach(function (x) { if (x.sessionId === sid) x.status = 'Logged'; });
        var t = cached('todo'); if (t) t.toLog = t.toLog.filter(function (x) { return x.sessionId !== sid; });
      });
      showToday(); return;
    }
    showToday(); notice('Logged ' + r.sessionId + ': ' + r.charged + ' charged.');
  }, { confirmed: function (r) { notice('Logged ' + r.sessionId + ': ' + r.charged + ' charged.'); } });
}

      '<div class="actions"><button class="primary" onclick="sendReminderPay(' + i + ')">💬 Send reminder</button><button class="secondary" onclick="payActions(\'reminders\',' + i + ')">More…</button></div></div>';
  }).join('');
  if (p.waiting.length) html += '<details class="card"><summary><b>Waiting for payment (' + p.waiting.length + ')</b></summary>' + p.waiting.map(function (r, i) {
    return '<div class="item" style="margin-top:8px;cursor:pointer" onclick="payActions(\'waiting\',' + i + ')"><span>' + cur(r) + ' ' + esc(r.name) +
      '<div class="sub">Sent ' + esc(fmtDate(r.sent)) + (r.status === 'Transfer sent' ? ' · transfer on its way' : '') + (r.reminders ? ' · ' + r.reminders + ' reminders' : '') + '</div></span><span>' + amt(r.amount, r.currency) + ' ›</span></div>';

// Opens WhatsApp with the request and records it as sent.
function sendRequest(i) {
  var r = TODO.payments.ready[i];
  window.open('https://wa.me/' + (r.phone || '') + '?text=' + encodeURIComponent(r.message), '_blank');
  if (!r.phone) notice('No WhatsApp number saved: pick the chat in WhatsApp.');
  call('statementSent', { id: r.id, amount: r.amount, currency: r.currency, sessions: r.sessions, due: r.due, message: r.message }, function () {}, { optimistic: function () {
    patchLocal(function () {
      var t = cached('todo'); if (!t) return;
      t.payments.ready = t.payments.ready.filter(function (x) { return x.id !== r.id; });

function sendReminderPay(i) {
  var r = TODO.payments.reminders[i];

// Options for an open request: transfer on its way, record the payment, or withdraw it.
function payActions(list, i) {

  sheet(r.name + ' · ' + amt(r.amount, r.currency), '<div class="sub">Request sent ' + esc(fmtDate(r.sent)) + (r.statementId ? '' : ' (still saving)') + '.</div>' +

    '<div class="sub" style="margin-top:8px">"Transfer on its way" pauses reminders (e.g. a USD transfer that takes a few days).</div>' +
    '<button class="secondary" style="width:100%;margin-top:12px" onclick="withdrawRequest()">Withdraw this request</button>');
}
var PAY_SEL = null;
function closeSheet() { var bg = document.querySelector('.sheet-bg'); if (bg) bg.remove(); }
function payFromRequest() { closeSheet(); paymentForm(PAY_SEL.id, { amount: PAY_SEL.amount, currency: PAY_SEL.type === 2 ? 'EGP' : PAY_SEL.currency }); }
function transferFlag(on) {
  var r = PAY_SEL; if (!r.statementId) return notice('Still saving the request; try again in a moment.');
  call('transferSent', { statementId: r.statementId, undo: !on }, function () {}, { optimistic: function () {
    patchLocal(function () { var t = cached('todo'); if (t) ['waiting', 'reminders'].forEach(function (l) { t.payments[l].forEach(function (x) { if (x.statementId === r.statementId) x.status = on ? 'Transfer sent' : 'Sent'; }); }); });

// Payment texts forwarded from the bank (InstaPay): amount and reference read from the text, matched to open requests.
function loadSms() {
  if (!READ_URL) return;
  fetch(READ_URL + '/sms', { headers: { Authorization: 'Bearer ' + TOKEN }, credentials: 'omit', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    SMS = (j.items || []).map(function (it) { var v = {}; try { v = JSON.parse(it.value); } catch (e) {} return Object.assign(parseSms(v.text || ''), { key: it.key, at: v.at, text: v.text || '' }); });
    var box = document.getElementById('todo-sms');
    if (!box || !SMS.length) return;
    var open = TODO.payments.ready.concat(TODO.payments.reminders, TODO.payments.waiting);
    box.innerHTML = '<h2>Money received (bank texts)</h2>' + SMS.map(function (m, i) {
      var match = open.filter(function (r) { return m.amount && Math.abs(r.amount - m.amount) < 0.5 && (r.currency === m.currency || r.type === 2); });
      return '<div class="card"><div class="item"><b>' + (m.amount ? amt(m.amount, m.currency) : 'Amount not found') + '</b><span class="sub">' + esc(fmtDate(String(m.at).slice(0, 10))) + '</span></div>' +
        '<div class="sub" style="white-space:pre-wrap">' + esc(m.text.slice(0, 300)) + '</div>' + (m.ref ? '<div class="sub">Ref ' + esc(m.ref) + '</div>' : '') +

        '<button onclick="smsPick(' + i + ')">' + (match.length ? 'Someone else…' : 'Whose is it?') + '</button><button class="secondary" onclick="forgetSms(SMS[' + i + '].key);loadSms()">Not a payment</button></div></div>';
    }).join('');
  }).catch(function () {});

// "You have received EGP 3,600.00 … Ref 123456" → {amount, currency, ref}.
function parseSms(t) {
  var s = String(t).replace(/٬/g, ',');
  var m = s.match(/(EGP|E£|LE|جنيه|USD|\$)\s*([0-9][0-9,]*(?:\.[0-9]+)?)/i) || s.match(/([0-9][0-9,]*(?:\.[0-9]+)?)\s*(EGP|LE|جنيه|USD)/i);
  var amount = 0, currency = 'EGP';
  if (m) { var num = /[0-9]/.test(m[1]) ? m[1] : m[2], c = /[0-9]/.test(m[1]) ? m[2] : m[1]; amount = Number(String(num).replace(/,/g, '')); currency = /USD|\$/i.test(c) ? 'USD' : 'EGP'; }
  var r = s.match(/(?:ref(?:erence)?(?:\s*(?:no|number|#))?|رقم\s*(?:المرجع|العملية))\s*[:#.]?\s*([A-Z0-9]{5,})/i);
  return { amount: amount, currency: currency, ref: r ? r[1] : '' };
}

function smsRecord(i, studentId) {
  var m = SMS[i];
  paymentForm(studentId, { amount: m.amount, currency: m.currency, reference: m.ref, note: 'InstaPay' + (m.ref ? ' ' + m.ref : ''), date: String(m.at).slice(0, 10), smsKey: m.key });
}
function smsPick(i) {
  sheet('Whose payment?', sel('smsw', '', [['', 'Pick the student']].concat(TODO.people.map(function (p) { return [p.id, p.name]; }))) +
    '<button class="primary" style="width:100%;margin-top:10px" onclick="var v=document.getElementById(\'smsw\').value;if(!v)return;closeSheet();smsRecord(' + i + ',v)">Record payment</button>');
}
function forgetSms(key) {
  fetch(READ_URL + '/sms/' + encodeURIComponent(key), { method: 'DELETE', headers: { Authorization: 'Bearer ' + TOKEN }, credentials: 'omit' }).catch(function () {});
}

      var retry = ['joinSubmit', 'addAdjustment', 'addAccount', 'undoSession', 'undoStudentEdit', 'updateStudent', 'confirmAccount'].indexOf(action) < 0;

            if (n < 2 && retry) return setTimeout(function () { attempt(n + 1); }, 1500);

              : 'Not sure this was saved (connection problem). Tap Refresh and check before trying again.'));

    }
  };

} } };

// Keeps the last loaded data on this device, so the app opens with it instantly and refreshes in the background.
function saveCache() {

    catch (e) {                                    // too big for the phone's storage: keep everything but the student pages
      try { var c = {}; Object.keys(CACHE).forEach(function (k) { if (k.indexOf('profile|') !== 0) c[k] = CACHE[k]; }); localStorage.setItem('th_cache', JSON.stringify(c)); } catch (e2) {}

}
function loadCache() {

  // so the icon must be added from the full link to carry the token in.
  if (m) { try { localStorage.setItem('th_token', m[1]); } catch (e) {} }
  var token = ''; try { token = localStorage.getItem('th_token') || ''; } catch (e) {}
  if (!token) {
    document.getElementById('splash').innerHTML = '<div class="splash-name">Tutoring Hub</div><div class="sub" style="max-width:300px;text-align:center;line-height:1.5">' +
      'This copy of the app has no sign-in yet.<br>Open your private setup link in Safari, then Share → Add to Home Screen from that page.</div>';
    return;
  }
  loadCache();
  start(token);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

boot();</script>
</body>
</html>
