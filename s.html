<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Student page · Mr Zein's Tutoring Groups</title>
  <style>
    :root { --bg:#f3f5f9; --card:#fff; --text:#18202e; --sub:#5b6577; --line:#e3e7ef; --accent:#2457c5; --due:#b45309; --due-bg:#fff7ed; --ok:#15803d; --ok-bg:#f0fdf4; --bad:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#10141c; --card:#1a2030; --text:#e8ecf3; --sub:#9aa5b8; --line:#2c3446; --accent:#7aa2ff; --due:#fbbf24; --due-bg:#2a2112; --ok:#4ade80; --ok-bg:#12261a; --bad:#ff8a80; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
    .brand { color:var(--accent); font-weight:700; }
    h1 { font-size:24px; margin:4px 0 0; } .ar { direction:rtl; font-family:"Geeza Pro","Noto Naskh Arabic",Tahoma,sans-serif; color:var(--sub); }
    h2 { font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--sub); margin:22px 0 8px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; }
    .due { background:var(--due-bg); border-color:var(--due); } .due .big { color:var(--due); }
    .clear { background:var(--ok-bg); border-color:var(--ok); } .clear .big { color:var(--ok); }
    .big { font-size:26px; font-weight:700; }
    .row { display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); } .row:last-child { border-bottom:0; }
    .sub { color:var(--sub); font-size:14px; }
    .ok { color:var(--ok); } .late { color:var(--due); } .miss { color:var(--bad); }
    footer { margin-top:24px; font-size:12px; color:var(--sub); }
    .tbl { padding:6px 0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .tbl table { border-collapse:collapse; width:100%; min-width:560px; font-size:14px; }
    .tbl th { text-align:left; font-size:12px; font-weight:600; color:var(--sub); padding:6px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
    .tbl td { padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:top; }
    .tbl tr:last-child td { border-bottom:0; } .tbl .num { text-align:right; }
    .key p { font-size:14px; margin:8px 0; color:var(--text); } .key summary { cursor:pointer; }
  </style>
</head>
<body>
<main id="main"><p class="sub">Loading…</p></main>
<script>
var READ = 'https://tutoring-hub.abdelrahmanzein.workers.dev';
var KEY = (new URLSearchParams(location.search).get('k') || '').replace(/[^0-9a-f]/g, '');
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function d(v) { var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? +m[3] + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : ''; }
function day(v) { var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ''; var x = new Date(+m[1], +m[2] - 1, +m[3]); return DAYS[x.getDay()] + ' ' + +m[3] + ' ' + MONTHS[+m[2] - 1]; }
function money(n, c) { var v = Math.round(Number(n) * 100) / 100; return (v % 1 ? v.toFixed(2) : String(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + ' ' + c; }

function draw(p) {
  var c = p.currency, html = '<div class="brand">Mr Zein\'s Tutoring Groups</div><h1>' + esc(p.name) + '</h1>' + (p.nameAr ? '<div class="ar">' + esc(p.nameAr) + '</div>' : '') +
    (p.group ? '<div class="sub">' + esc(p.group) + '</div>' : '');
  html += '<h2>Financials</h2>';
  if (p.due) {
    html += '<div class="card due"><div class="sub">Amount due</div><div class="big">' + money(p.due.amount, c) + '</div>' +
      (p.due.by ? '<div>by ' + esc(day(p.due.by)) + '</div>' : '<div class="sub">The payment request with the date comes shortly.</div>') +
      (p.type === 2 ? '<div class="sub">Paid as the EGP equivalent on the transfer day' + (p.due.egpToday ? ' (about ' + money(p.due.egpToday, 'EGP') + ' at today\'s rate)' : '') + '.</div>' : '') +
      (p.type === 3 ? '<div class="sub">Covers the sessions taken and the next 4 sessions.</div>' : '') +
      (p.due.transferSent ? '<div class="sub">Noted that the transfer is on its way. Thank you.</div>' : '') + '</div>';
  } else {
    html += '<div class="card clear"><div class="big">Nothing to pay now</div>' +
      (p.aheadSessions ? '<div>' + p.aheadSessions + ' session' + (p.aheadSessions > 1 ? 's' : '') + ' already paid in advance.</div>' : '') +
      (p.sessionsSinceLastPayment ? '<div class="sub">' + p.sessionsSinceLastPayment + ' session' + (p.sessionsSinceLastPayment > 1 ? 's' : '') + ' since the last payment; a payment request comes after ' + (p.every || 4) + ' sessions.</div>' : '') + '</div>';
  }
  if (p.due && p.pay) html += '<div class="card"><div class="sub">How to pay</div>' + (p.pay.kind === 'instapay'
      ? '<a href="' + esc(p.pay.link) + '" style="display:block;text-align:center;margin-top:8px;padding:12px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none">Pay with InstaPay</a>'
      : '<div style="white-space:pre-wrap;margin-top:6px;font-size:15px">' + esc(p.pay.text) + '</div>') + '</div>';
  if (p.lastPayment) html += '<div class="card"><div class="row"><span>Last payment</span><span>' + money(p.lastPayment.amount, c) + ' · ' + esc(d(p.lastPayment.date)) + '</span></div></div>';
  if (p.note && p.note.text) html += '<h2>A note from Mr Zein</h2><div class="card"><div style="white-space:pre-wrap">' + esc(p.note.text) + '</div>' + (p.note.date ? '<div class="sub">' + esc(d(p.note.date)) + '</div>' : '') + '</div>';
  if (p.coverNotes && p.coverNotes.length) html += '<h2>1-on-1 sessions</h2>' + p.coverNotes.map(function (c) {
    return '<div class="card"><div class="sub">' + esc(d(c.date)) + ' · with ' + esc(c.from) + '</div>' + (c.covered ? '<div><b>Covered:</b> ' + esc(c.covered) + '</div>' : '') + '<div style="white-space:pre-wrap">' + esc(c.text) + '</div></div>'; }).join('');
  // The sessions table (exactly the sessions in the amount due, or the recent ones), then a key to the labels.
  var rows = p.rows || [];
  if (rows.length) {
    var att = function (u) {
      if (u.attended === undefined) return '<span class="sub">No record</span>';
      return u.attended ? (u.lateUnknown ? '<span class="ok">Attended</span>' : u.late ? '<span class="late">Late, ' + u.late + ' min</span>' : '<span class="ok">On time</span>') : '<span class="miss">Absent</span>';
    };
    var hwc = function (s) { return s === 'On time' || s === 'Excused' ? 'ok' : s === 'Late' ? 'late' : s === 'Missing' ? 'miss' : ''; };
    var amountCol = p.reportCovers === 'amount';
    html += '<h2>' + (amountCol ? 'The ' + rows.length + ' sessions in this amount' : 'Recent sessions') + '</h2>' +
      '<div class="card tbl"><table><thead><tr><th>Session</th><th>Attendance</th><th>Participation</th><th>Homework for this session</th>' + (amountCol ? '<th class="num">Fee</th>' : '') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr><td>' + esc(day(r.date)) + '</td><td>' + att(r) + '</td><td>' + (r.participation ? esc(r.participation) : '<span class="sub">–</span>') + '</td>' +
          '<td>' + (r.homework ? '<span class="' + hwc(r.homework.status) + '">' + esc(r.homework.status) + '</span> <span class="sub">' + esc(r.homework.title) + '</span>' : '<span class="sub">–</span>') + '</td>' +
          (amountCol ? '<td class="num">' + money(r.amount, c) + '</td>' : '') + '</tr>';
      }).join('') + '</tbody></table></div>';
    var sm = p.summary || {}, light = function (label, x) {
      if (!x) return '';
      var known = x.of - (x.unknown || 0), r = known ? x.value / known : 1, dot = !known ? '⚪' : r >= 0.85 ? '🟢' : r >= 0.6 ? '🟡' : '🔴';
      return '<div class="row"><span>' + dot + ' ' + label + (x.unknown ? '<div class="sub">' + x.unknown + ' of these session' + (x.unknown > 1 ? 's are' : ' is') + ' from before attendance was recorded</div>' : '') + (x.note ? '<div class="sub">' + esc(x.note) + '</div>' : '') + '</span><span>' + x.value + ' of ' + x.of + '</span></div>';
    };
    if (sm.attendance || sm.homework) html += '<div class="card">' + light('Sessions attended', sm.attendance) + light('Arrived on time', sm.punctuality && sm.attendance && sm.punctuality.of < sm.attendance.value ? Object.assign({ note: 'counted over the ' + sm.punctuality.of + ' sessions with recorded join times' }, sm.punctuality) : sm.punctuality) + light('Homework on time', sm.homework) + '</div>';
    html += '<details class="card key"><summary><b>What the labels mean</b></summary>' +
      '<p><b>Attendance.</b> <span class="ok">On time</span>: joined when the session started. <span class="late">Late</span>: joined more than 2 minutes after the start (minutes shown). <span class="miss">Absent</span>: missed the session; the recording is sent and the session is charged. Attended: present, from before join times were recorded.</p>' +
      '<p><b>Participation</b> (from the session\'s transcript, compared with the rest of the group): <b>Very active</b>: spoke up and asked questions well above the group\'s average. <b>Active</b>: about the group\'s average. <b>Occasional</b>: spoke up a few times. <b>Quiet</b>: hardly spoke. "–" means it wasn\'t measured that session.</p>' +
      '<p><b>Homework.</b> <span class="ok">On time</span>: uploaded by 11:59 PM (Cairo) the night before the session. <span class="late">Late</span>: uploaded after that. <span class="miss">Missing</span>: not uploaded. Excused: agreed with Mr Zein.</p>' +
      '<p>🟢 most of the time · 🟡 often · 🔴 needs attention.</p></details>';
  }
  html += '<footer>Updated ' + esc(d(p.updated)) + '. If a student is absent, the recording is sent and the session is charged.</footer>';
  document.getElementById('main').innerHTML = html;
  document.title = p.name + ' · Mr Zein\'s Tutoring Groups';
}

if (!KEY) document.getElementById('main').innerHTML = '<div class="card">This link is not complete.</div>';
else fetch(READ + '/p/' + KEY, { credentials: 'omit', cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; })
  .then(function (p) { if (p) draw(p); else document.getElementById('main').innerHTML = '<div class="card">This link is not valid.</div>'; })
  .catch(function () { document.getElementById('main').innerHTML = '<div class="card">Could not load the page. Please check the internet and try again.</div>'; });
</script>
</body>
</html>
