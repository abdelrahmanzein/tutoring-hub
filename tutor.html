<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Cover sessions · Mr Zein's Tutoring Groups</title>
  <style>
    :root { --bg:#f3f5f9; --card:#fff; --text:#18202e; --sub:#5b6577; --line:#d9dee8; --accent:#2457c5; --ok:#15803d; --bad:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#10141c; --card:#1a2030; --text:#e8ecf3; --sub:#9aa5b8; --line:#2c3446; --accent:#7aa2ff; --ok:#4ade80; --bad:#ff8a80; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width:560px; margin:0 auto; padding:20px 16px 40px; } .brand { color:var(--accent); font-weight:700; } h1 { font-size:22px; margin:4px 0 12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; } .sub { color:var(--sub); font-size:14px; }
    label { display:block; margin-top:10px; font-size:14px; color:var(--sub); }
    input, select, textarea { width:100%; margin-top:4px; padding:10px 12px; font:inherit; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--text); }
    button { width:100%; margin-top:12px; padding:12px; font:inherit; font-weight:600; border:0; border-radius:12px; background:var(--accent); color:#fff; } button:disabled { opacity:.6; }
    .ok { color:var(--ok); } .err { color:var(--bad); margin-top:8px; }
  </style>
</head>
<body>
<main id="main"><p class="sub">Loading…</p></main>
<script>// Front page on GitHub Pages: talks to the Apps Script web app with fetch, but keeps the same
// google.script.run calls the screens already use, so the screens are shared with the Apps Script version.
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbyCLTCfTmk_UHXW6_aSQ28cSyYRWWiUpFdx4Tsa5epjAviwggqbnqIvu89apC2YxQdz/exec';
var google = { script: { get run() {
  var ok = function () {}, fail = function () {};
  var o = {
    withSuccessHandler: function (f) { ok = f; return o; },
    withFailureHandler: function (f) { fail = f; return o; },
    api: function (token, action, args) {
      // Google sometimes answers with an error page (cold start); one quiet retry fixes almost all of them.
      // Only reads and self-protecting saves are retried (payments re-check the balance, sessions refuse duplicates,
      // imports and deletes are safe to repeat). Other saves are never repeated automatically.
      var retry = ['tutorReport', 'joinSubmit', 'addAdjustment', 'addAccount', 'undoSession', 'undoStudentEdit', 'updateStudent', 'confirmAccount'].indexOf(action) < 0;
      var attempt = function (n) {
        fetch(EXEC_URL, { method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify({ token: token, action: action, args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            // Hand the answer over outside this promise, so a drawing problem on the page is never reported as "no connection".
            setTimeout(function () { if (j.ok) ok(j.res); else fail(new Error(j.error)); }, 0);
          })
          .catch(function (e) {
            // Google sometimes answers with an error page instead of data ("The string did not match the expected pattern").
            if (n < 3 && retry) return setTimeout(function () { attempt(n + 1); }, 1500 * n);
            fail(new Error(retry ? 'Google didn\'t answer just now. Tap Refresh in a moment.'
              : 'Not sure this was saved (connection problem). Tap Refresh and check before trying again.'));
          });
      };
      attempt(1);
    }
  };
  return o;
} } };

// Keeps the last loaded data on this device, so the app opens with it instantly and refreshes in the background.
function saveCache() {
  setTimeout(function () {
    try { localStorage.setItem('th_cache', JSON.stringify(CACHE)); }
    catch (e) {                                    // too big for the phone's storage: keep everything but the student pages
      try { var c = {}; Object.keys(CACHE).forEach(function (k) { if (k.indexOf('profile|') !== 0) c[k] = CACHE[k]; }); localStorage.setItem('th_cache', JSON.stringify(c)); } catch (e2) {}
    }
  }, 0);
}
function loadCache() {
  try {
    var c = JSON.parse(localStorage.getItem('th_cache') || 'null');
    // Saved data shows at once but counts as old: it's replaced as soon as the fresh download arrives.
    if (c) { Object.keys(c).forEach(function (k) { c[k].snap = false; c[k].at = 0; }); CACHE = c; }
  } catch (e) { /* ignore */ }
}

// The secret token comes once in the link (#t=...), is kept on this device, and removed from the address bar.
function boot() {
  var m = location.hash.match(/t=([0-9a-f]+)/);
  // The token stays in the link on purpose: an iPhone Home Screen app keeps its own storage, separate from Safari,
  // so the icon must be added from the full link to carry the token in.
  if (m) { try { localStorage.setItem('th_token', m[1]); } catch (e) {} }
  var token = ''; try { token = localStorage.getItem('th_token') || ''; } catch (e) {}
  if (!token) {
    document.getElementById('splash').innerHTML = '<div class="splash-name">Tutoring Hub</div><div class="sub" style="max-width:300px;text-align:center;line-height:1.5">' +
      'This copy of the app has no sign-in yet.<br>Open your private setup link in Safari, then Share → Add to Home Screen from that page.</div>';
    return;
  }
  loadCache();
  start(token);
}
</script>
<script>
var KEY = (new URLSearchParams(location.search).get('k') || '').replace(/[^0-9a-f]/g, '');
function api(action, args, ok, fail) {
  google.script.run.withSuccessHandler(function (r) { ok(r.data); }).withFailureHandler(function (e) { fail(e.message || String(e)); }).api('', action, args);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function d(v) { var m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? +m[3] + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1] : ''; }
var DATA = null;
function today() { var x = new Date(); return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); }

// Your page: log each session you held with one of your students, and see (and correct) what you logged.
function draw(p) {
  DATA = p;
  var m = document.getElementById('main');
  if (!p.valid) { m.innerHTML = '<div class="card">This link is not valid.</div>'; return; }
  m.innerHTML = '<div class="brand">Mr Zein\'s Tutoring Groups</div><h1>Hello ' + esc(p.name) + '</h1>' +
    '<div class="sub">Log each 1-on-1 session after you give it. Only sessions that took place: if the student didn\'t come, there\'s nothing to log.</div>' +
    (p.students.length ? '<div class="card"><b>＋ Log a session</b>' +
      '<label>Student<select id="ls"><option value="">Pick the student</option>' + p.students.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select></label>' +
      '<label>Date<input id="ld" type="date" value="' + today() + '" max="' + today() + '"></label>' +
      '<label>Length (minutes)<input id="lm" type="number" inputmode="numeric" value="60" min="15" step="15"></label>' +
      '<label>What did the session cover?<textarea id="lc" rows="2"></textarea></label>' +
      '<label>Homework set (if any)<input id="lh"></label>' +
      '<label>Comments on the student\'s work (shared with the family after Mr Zein reads them)<textarea id="lk" rows="3"></textarea></label>' +
      '<button id="lb" onclick="logNew()">Save the session</button><div id="le" class="err"></div></div>'
      : '<div class="card sub">No students are assigned to you yet. Mr Zein will add them.</div>') +
    (p.sessions.length ? '<h2 style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:22px 0 8px">Your sessions</h2>' + p.sessions.map(function (s, i) {
      return '<details class="card"><summary><b>' + esc(s.student) + '</b> <span class="sub">' + esc(d(s.date)) + ' · ' + esc(s.minutes) + ' min</span></summary>' +
        '<label>Length (minutes)<input id="m' + i + '" type="number" value="' + esc(s.minutes) + '"></label>' +
        '<label>What did the session cover?<textarea id="c' + i + '" rows="2">' + esc(s.covered || '') + '</textarea></label>' +
        '<label>Homework set (if any)<input id="h' + i + '" value="' + esc(s.homework || '') + '"></label>' +
        '<label>Comments<textarea id="k' + i + '" rows="3">' + esc(s.comments || '') + '</textarea></label>' +
        '<button id="b' + i + '" onclick="fix(' + i + ')">Save changes</button><div id="e' + i + '" class="err"></div></details>';
    }).join('') : '');
}

function logNew() {
  var b = document.getElementById('lb'), e = document.getElementById('le'), v = function (id) { return document.getElementById(id).value; };
  if (!v('ls')) { e.textContent = 'Pick the student.'; return; }
  if (!v('lc').trim()) { e.textContent = 'Please write what the session covered.'; return; }
  b.disabled = true; b.textContent = 'Saving…'; e.textContent = '';
  api('tutorLog', { token: KEY, studentId: v('ls'), date: v('ld'), minutes: v('lm'), covered: v('lc'), homework: v('lh'), comments: v('lk') }, function () {
    api('tutorPage', { token: KEY }, function (p) { draw(p); var x = document.getElementById('le'); if (x) x.innerHTML = '<span class="ok">Saved. Thank you.</span>'; }, function () {});
  }, function (msg) { b.disabled = false; b.textContent = 'Save the session'; e.textContent = msg; });
}

function fix(i) {
  var s = DATA.sessions[i], b = document.getElementById('b' + i);
  b.disabled = true; b.textContent = 'Saving…';
  api('tutorLog', { token: KEY, coverId: s.id, minutes: document.getElementById('m' + i).value, covered: document.getElementById('c' + i).value,
    homework: document.getElementById('h' + i).value, comments: document.getElementById('k' + i).value },
    function () { b.disabled = false; b.textContent = 'Save changes'; document.getElementById('e' + i).innerHTML = '<span class="ok">Saved.</span>'; },
    function (msg) { b.disabled = false; b.textContent = 'Save changes'; document.getElementById('e' + i).textContent = msg; });
}

api('tutorPage', { token: KEY }, draw, function (msg) { document.getElementById('main').innerHTML = '<div class="card err">' + esc(msg) + '</div>'; });
</script>
</body>
</html>
